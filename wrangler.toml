name = "stock-assessment"
pages_build_output_dir = "./dist"
compatibility_date = "2026-07-11"

# D1：先在 Pages 项目里建好库，再把 id 填进来
[[d1_databases]]
binding = "DB"
database_name = "stock-journal"
database_id = "f5cc80bf-28a3-4155-8045-8bbfe4a77c51"

# 开启日志
[observability.logs]
enabled = true

[vars]
STOCK_SECID = "1.000001"
WX_PUSH_URL = "https://hpbnvpiosrzhgyxbrwpt.supabase.co/functions/v1/wx-push"

# 以下三个走 secret，不要写在这里：
